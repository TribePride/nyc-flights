name: daily

on:
  schedule:
    - cron: "0 10 * * *"   # 6am New York (EDT)
  workflow_dispatch:
    inputs:
      collect:
        description: "Collect prices (spends up to 8 SerpApi searches). Untick to only redeploy the site."
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a re-run otherwise checks out the original commit and its push gets rejected
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -q
      - run: python -m collector.run
        if: github.event_name == 'schedule' || inputs.collect
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/deals.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
